services:
  web:
    build: .
    restart: always
    ports:
      - "80:8000"
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL:-postgresql://preventivatore_user:secretpassword@db:5432/preventivatore_db}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-preventivatore_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secretpassword}
      - POSTGRES_DB=${POSTGRES_DB:-preventivatore_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-preventivatore_user} -d ${POSTGRES_DB:-preventivatore_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
