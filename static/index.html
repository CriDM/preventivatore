<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preventivatore Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-top: 20px; }
        .card { margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<div class="container">
    <h1 class="text-center mb-4">Genera Preventivo</h1>

    <div class="row">
        <!-- Customer Info -->
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">Dati Cliente</div>
                <div class="card-body">
                    <input type="text" id="customer_name" class="form-control mb-2" placeholder="Nome Cliente (es. Mario Rossi)" required>
                    <input type="text" id="customer_address" class="form-control mb-2" placeholder="Indirizzo (es. Via Roma 1, Milano)">
                    <input type="text" id="contact_person" class="form-control mb-2" placeholder="Referente">
                    <input type="text" id="oggetto" class="form-control mb-2" placeholder="Oggetto del preventivo">
                </div>
            </div>
        </div>

        <!-- Company Info Override -->
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-secondary text-white">I Tuoi Dati (sovrascrive DB se compilati)</div>
                <div class="card-body">
                    <input type="text" id="company_name" class="form-control mb-2" placeholder="Nome Tua Azienda">
                    <input type="text" id="company_address" class="form-control mb-2" placeholder="Tuo Indirizzo">
                    <input type="text" id="quote_date" class="form-control mb-2" placeholder="Data (es. 04/08/2026)">
                </div>
            </div>
        </div>
    </div>

    <!-- Items -->
    <div class="card">
        <div class="card-header bg-success text-white">Articoli</div>
        <div class="card-body">
            <table class="table" id="itemsTable">
                <thead>
                    <tr>
                        <th>Descrizione</th>
                        <th>Quantità</th>
                        <th>Prezzo Unitario (€)</th>
                        <th>IVA (%)</th>
                        <th>Azione</th>
                    </tr>
                </thead>
                <tbody id="itemsBody">
                    <tr>
                        <td><input type="text" class="form-control item-name" value="Sviluppo Sito Web"></td>
                        <td><input type="number" class="form-control item-qty" value="1" min="1"></td>
                        <td><input type="number" class="form-control item-price" value="1000" step="0.01"></td>
                        <td><input type="number" class="form-control item-vat" value="22"></td>
                        <td><button class="btn btn-danger btn-sm" onclick="this.parentElement.parentElement.remove()">X</button></td>
                    </tr>
                </tbody>
            </table>
            <button class="btn btn-outline-success btn-sm" onclick="addRow()">+ Aggiungi Riga</button>
        </div>
    </div>

    <div class="text-center mt-4 mb-5">
        <button class="btn btn-primary btn-lg" id="generateBtn" onclick="generatePDF()">Genera PDF</button>
    </div>
</div>

<script>
    function addRow() {
        const tbody = document.getElementById('itemsBody');
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><input type="text" class="form-control item-name" placeholder="Descrizione"></td>
            <td><input type="number" class="form-control item-qty" value="1" min="1"></td>
            <td><input type="number" class="form-control item-price" value="0" step="0.01"></td>
            <td><input type="number" class="form-control item-vat" value="22"></td>
            <td><button class="btn btn-danger btn-sm" onclick="this.parentElement.parentElement.remove()">X</button></td>
        `;
        tbody.appendChild(tr);
    }

    async function generatePDF() {
        const btn = document.getElementById('generateBtn');
        btn.disabled = true;
        btn.innerText = "Generazione in corso...";

        // Collect Auth
        const auth = prompt("Inserisci la password per accedere all'API:", "Antonio2026");
        if (!auth) {
            btn.disabled = false;
            btn.innerText = "Genera PDF";
            return;
        }

        const credentials = btoa("admin:" + auth);

        // Collect Items
        const rows = document.querySelectorAll('#itemsBody tr');
        const items = [];

        rows.forEach(row => {
            const name = row.querySelector('.item-name').value;
            const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
            const price = parseFloat(row.querySelector('.item-price').value) || 0;
            const vat = parseFloat(row.querySelector('.item-vat').value) || 0;

            if(name) {
                const total = qty * price;
                const totalWithVat = total * (1 + (vat/100));
                items.push({
                    name: name,
                    quantity: qty,
                    unit_price: price,
                    total: total,
                    vat_percent: vat,
                    total_with_vat: totalWithVat
                });
            }
        });

        // Build Payload
        const payload = {
            data: {
                customer_name: document.getElementById('customer_name').value,
                customer_address: document.getElementById('customer_address').value,
                contact_person: document.getElementById('contact_person').value,
                oggetto: document.getElementById('oggetto').value,
                company_name: document.getElementById('company_name').value,
                company_address: document.getElementById('company_address').value,
                quote_date: document.getElementById('quote_date').value || new Date().toLocaleDateString('it-IT')
            },
            items: items
        };

        try {
            const response = await fetch('/generate-pdf', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Basic ' + credentials
                },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'preventivo.pdf';
                document.body.appendChild(a);
                a.click();
                a.remove();
            } else {
                const err = await response.text();
                alert("Errore durante la generazione: " + err);
            }
        } catch (error) {
            alert("Errore di rete: " + error);
        }

        btn.disabled = false;
        btn.innerText = "Genera PDF";
    }
</script>
</body>
</html>
