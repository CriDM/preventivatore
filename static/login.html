<!DOCTYPE html>
<html lang="it" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi - Preventivatore</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'system';
            let effectiveTheme = savedTheme;
            if (savedTheme === 'system') {
                effectiveTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-bs-theme', effectiveTheme);
        })();
    </script>

    <style>
        :root, [data-bs-theme="light"] {
            --primary-color: #c41e3a;
            --primary-hover: #a0182e;
            --bg-page: #f1f5f9;
            --card-bg: #ffffff;
            --card-border: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
            --input-color: #0f172a;
        }

        [data-bs-theme="dark"] {
            --primary-color: #e11d48;
            --primary-hover: #f43f5e;
            --bg-page: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: #0f172a;
            --input-border: #334155;
            --input-color: #f8fafc;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .theme-toggle-container {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .login-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            padding: 40px;
            width: 100%;
            max-width: 420px;
            transition: transform 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-2px);
        }

        .brand-icon {
            width: 64px;
            height: 64px;
            background: rgba(196, 30, 58, 0.15);
            color: var(--primary-color);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 20px auto;
            border: 1px solid rgba(196, 30, 58, 0.3);
        }

        .form-control {
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            color: var(--input-color);
            padding: 12px 16px;
            font-size: 15px;
        }

        .form-control:focus {
            background-color: var(--input-bg);
            border-color: var(--primary-color);
            color: var(--input-color);
            box-shadow: 0 0 0 0.25rem rgba(196, 30, 58, 0.25);
        }

        .btn-primary {
            background-color: var(--primary-color);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            font-size: 16px;
            width: 100%;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            box-shadow: 0 6px 16px rgba(196, 30, 58, 0.3);
        }

        .alert {
            border-radius: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="theme-toggle-container">
    <div class="dropdown">
        <button class="btn btn-outline-secondary btn-sm dropdown-toggle d-flex align-items-center" type="button" id="themeDropdown" data-bs-toggle="dropdown" aria-expanded="false">
            <span id="themeDropdownLabel"><i class="bi bi-display me-1"></i> Sistema</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="themeDropdown">
            <li><button class="dropdown-item d-flex align-items-center" onclick="setTheme('system')"><i class="bi bi-display me-2"></i> Tema di Sistema</button></li>
            <li><button class="dropdown-item d-flex align-items-center" onclick="setTheme('light')"><i class="bi bi-sun-fill me-2 text-warning"></i> Chiaro</button></li>
            <li><button class="dropdown-item d-flex align-items-center" onclick="setTheme('dark')"><i class="bi bi-moon-stars-fill me-2 text-primary"></i> Scuro</button></li>
        </ul>
    </div>
</div>

<div class="login-card">
    <div class="text-center mb-3">
        <img src="/static/logo.png" alt="Preventivatore Logo" style="height: 80px; width: 80px; object-fit: contain; border-radius: 18px; box-shadow: 0 8px 24px rgba(196,30,58,0.3);">
    </div>
    <h3 class="text-center fw-bold mb-1" style="color: var(--text-main);">Preventivatore</h3>
    <p class="text-center text-muted mb-4 fs-6">Inserisci le credenziali per accedere</p>

    <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="mb-3">
            <label class="form-label text-muted small fw-medium">NOME UTENTE</label>
            <div class="input-group">
                <span class="input-group-text bg-transparent text-muted" style="border-color: var(--input-border);">
                    <i class="bi bi-person"></i>
                </span>
                <input type="text" id="username" class="form-control border-start-0" placeholder="Username" required autofocus>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label text-muted small fw-medium">PASSWORD</label>
            <div class="input-group">
                <span class="input-group-text bg-transparent text-muted" style="border-color: var(--input-border);">
                    <i class="bi bi-lock"></i>
                </span>
                <input type="password" id="password" class="form-control border-start-0" placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary">
            <span id="btnText">Accedi</span>
            <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"></span>
        </button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // --- THEME MANAGEMENT ---
    function getSavedTheme() {
        return localStorage.getItem('theme') || 'system';
    }

    function applyTheme(theme) {
        let effectiveTheme = theme;
        if (theme === 'system') {
            effectiveTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-bs-theme', effectiveTheme);
        
        const btnText = document.getElementById('themeDropdownLabel');
        if (btnText) {
            if (theme === 'system') btnText.innerHTML = '<i class="bi bi-display me-1"></i> Sistema';
            else if (theme === 'light') btnText.innerHTML = '<i class="bi bi-sun-fill me-1 text-warning"></i> Chiaro';
            else btnText.innerHTML = '<i class="bi bi-moon-stars-fill me-1 text-primary"></i> Scuro';
        }
    }

    function setTheme(theme) {
        localStorage.setItem('theme', theme);
        applyTheme(theme);
    }

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        if (getSavedTheme() === 'system') {
            applyTheme('system');
        }
    });

    applyTheme(getSavedTheme());

    async function handleLogin(e) {
        e.preventDefault();
        const usernameInput = document.getElementById('username').value.trim();
        const passwordInput = document.getElementById('password').value;
        const alertBox = document.getElementById('alertBox');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');

        alertBox.classList.add('d-none');
        submitBtn.disabled = true;
        btnText.innerText = "Accesso in corso...";
        btnSpinner.classList.remove('d-none');

        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: usernameInput, password: passwordInput })
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem('access_token', data.access_token);
                localStorage.setItem('user_role', data.role);
                localStorage.setItem('username', data.username);

                if (data.role === 'admin') {
                    window.location.href = '/admin';
                } else {
                    window.location.href = '/';
                }
            } else {
                alertBox.innerText = data.detail || "Errore durante l'accesso";
                alertBox.classList.remove('d-none');
            }
        } catch (err) {
            alertBox.innerText = "Errore di connessione al server";
            alertBox.classList.remove('d-none');
        } finally {
            submitBtn.disabled = false;
            btnText.innerText = "Accedi";
            btnSpinner.classList.add('d-none');
        }
    }
</script>
</body>
</html>
