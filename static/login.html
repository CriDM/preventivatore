<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi - Preventivatore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #c41e3a;
            --primary-hover: #a0182e;
            --bg-gradient: linear-gradient(135deg, #1e1e24 0%, #2b2d42 50%, #111116 100%);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            color: #f8f9fa;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            padding: 40px;
            width: 100%;
            max-width: 420px;
            transition: transform 0.3s ease;
        }
        .login-card:hover {
            transform: translateY(-2px);
        }
        .brand-icon {
            width: 64px;
            height: 64px;
            background: rgba(196, 30, 58, 0.15);
            color: var(--primary-color);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 20px auto;
            border: 1px solid rgba(196, 30, 58, 0.3);
        }
        .form-control {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #fff;
            padding: 12px 16px;
            font-size: 15px;
        }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--primary-color);
            color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(196, 30, 58, 0.25);
        }
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        .btn-primary {
            background-color: var(--primary-color);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            font-size: 16px;
            width: 100%;
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            background-color: var(--primary-hover);
            box-shadow: 0 6px 16px rgba(196, 30, 58, 0.4);
        }
        .alert {
            border-radius: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="brand-icon">
        <i class="bi bi-file-earmark-pdf-fill"></i>
    </div>
    <h3 class="text-center fw-bold mb-1">Preventivatore</h3>
    <p class="text-center text-white-50 mb-4 fs-6">Inserisci le credenziali per accedere</p>

    <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="mb-3">
            <label class="form-label text-white-50 small fw-medium">NOME UTENTE</label>
            <div class="input-group">
                <span class="input-group-text bg-transparent border-end-0 text-white-50" style="border-color: rgba(255, 255, 255, 0.15);">
                    <i class="bi bi-person"></i>
                </span>
                <input type="text" id="username" class="form-control border-start-0" placeholder="Username" required autofocus>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label text-white-50 small fw-medium">PASSWORD</label>
            <div class="input-group">
                <span class="input-group-text bg-transparent border-end-0 text-white-50" style="border-color: rgba(255, 255, 255, 0.15);">
                    <i class="bi bi-lock"></i>
                </span>
                <input type="password" id="password" class="form-control border-start-0" placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary">
            <span id="btnText">Accedi</span>
            <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"></span>
        </button>
    </form>
</div>

<script>
    async function handleLogin(e) {
        e.preventDefault();
        const usernameInput = document.getElementById('username').value.trim();
        const passwordInput = document.getElementById('password').value;
        const alertBox = document.getElementById('alertBox');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');

        alertBox.classList.add('d-none');
        submitBtn.disabled = true;
        btnText.innerText = "Accesso in corso...";
        btnSpinner.classList.remove('d-none');

        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: usernameInput, password: passwordInput })
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem('access_token', data.access_token);
                localStorage.setItem('user_role', data.role);
                localStorage.setItem('username', data.username);

                if (data.role === 'admin') {
                    window.location.href = '/admin';
                } else {
                    window.location.href = '/';
                }
            } else {
                alertBox.innerText = data.detail || "Errore durante l'accesso";
                alertBox.classList.remove('d-none');
            }
        } catch (err) {
            alertBox.innerText = "Errore di connessione al server";
            alertBox.classList.remove('d-none');
        } finally {
            submitBtn.disabled = false;
            btnText.innerText = "Accedi";
            btnSpinner.classList.add('d-none');
        }
    }
</script>
</body>
</html>
